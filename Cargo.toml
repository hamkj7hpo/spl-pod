[package]
name = "spl-pod"
version = "0.4.0"
description = "Solana Program Library Pod Utilities"
authors = ["Solana Labs Maintainers <maintainers@solanalabs.com>"]
repository = "https://github.com/hamkj7hpo/spl-pod"
license = "Apache-2.0"
edition = "2021"

[features]
no-entrypoint = []

[dependencies]
bytemuck = { version = "1.17.1", features = ["derive"] }
solana-program = { git = "https://github.com/hamkj7hpo/solana.git", branch = "safe-pump-compat" }
solana-zk-sdk = { git = "https://github.com/hamkj7hpo/solana.git", branch = "safe-pump-compat", optional = true }
spl-program-error = { git = "https://github.com/hamkj7hpo/solana-program-library.git", branch = "safe-pump-compat", package = "spl-program-error" }
thiserror = "1.0"

[lib]
crate-type = ["cdylib", "lib"]
