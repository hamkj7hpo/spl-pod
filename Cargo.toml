[package]
name = "spl-pod"
version = "0.4.0"
description = "Solana Program Library Plain Old Data"
authors = ["Solana Labs Maintainers <maintainers@solanalabs.com>"]
repository = "https://github.com/solana-labs/solana-program-library"
license = "Apache-2.0"
edition = "2021"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
borsh = { version = "1.5.1", optional = true }
bytemuck = { version = "1.17.1" }
bytemuck_derive = "1.7.1"
serde = { version = "1.0.209", optional = true }
solana-program = { git = "https://github.com/hamkj7hpo/solana.git", rev = "5208a7870826307290c30b7d80768f40267433a1" }

[dev-dependencies]
base64 = "0.22.1"
serde_json = "1.0.127"

[features]
borsh = ["dep:borsh"]
serde-traits = ["dep:serde"]
