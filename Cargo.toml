[package]
name = "spl-pod"
version = "0.4.0"
description = "Solana Program Library Pod Utilities"
authors = ["Solana Labs Maintainers <maintainers@solanalabs.com>"]
repository = "https://github.com/hamkj7hpo/spl-pod"
license = "Apache-2.0"
edition = "2021"

[features]
no-entrypoint = []

[dependencies]
zeroize = { git = "ssh://git@github.com/hamkj7hpo/zeroize.git", branch = "safe-pump-compat" }
solana-zk-sdk = { git = "ssh://git@github.com/hamkj7hpo/zk-elgamal-proof.git", branch = "safe-pump-compat" }
solana-program = { git = "ssh://git@github.com/hamkj7hpo/solana.git", branch = "safe-pump-compat" }
bytemuck = { version = "1.18.0", features = ["derive"] }
thiserror = "1.0"

[lib]
crate-type = ["cdylib", "lib"]

[patch.crates-io]
